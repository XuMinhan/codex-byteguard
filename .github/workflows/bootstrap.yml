name: Bootstrap official history
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Import public official history into private baseline branch
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: 89461ea6833832b0551ce24ee32205824d5c108d
        run: |
          git clone --bare https://github.com/openai/codex.git codex.git
          cd codex.git
          git cat-file -e "${BASELINE}^{commit}"
          git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' push "https://github.com/${GITHUB_REPOSITORY}.git" "${BASELINE}:refs/heads/upstream"
